name: Bug report
description: Report a reproducible HostPanel problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: HostPanel version
      placeholder: 1.2.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Deployment mode
      options:
        - Direct public-IP VPS
        - NAT / public-endpoint provider (including Helipod)
        - Reverse proxy / edge TLS
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens, private keys, and session secrets before posting.
      render: shell
